    <!-- jQuery library -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js">
		import opencard.opt.util.TLV;

    <!-- Popper JS -->

<body>
    <script>
	
	
        var baseurl = "http://localhost:9001";
        var api = "/api/mtppscrahost/";
		alert("No CORS Headers");
		
        function post(url, object, success, failed) {
            $.ajax({
                type: "POST",
                url: url,
				
                data: JSON.stringify(object),
                contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: success,
                error: function (errMsg) {
                    failed(errMsg);
                }
            });
        }
		
		function get(url, success, failed) {
            $.ajax({
                type: "GET",
                url: url,
				
				contentType: "application/json; charset=utf-8",
                dataType: "json",
                success: success,
				error: function (errMsg) {
                    failed(errMsg);
                }				
            });
        }


        function log(info) {
            var logText = $("#logArea").val();
            if (logText.length == 0)
			{
				$("#logArea").val(logText + info);
			}
			else
			{
				$("#logArea").val(logText + info + "\n\n");
			}
        }

        function startEmv() {
		
            var request = {};
            request.DeviceID = $("#DeviceID").val();
			request.WaitTime = 30;
            request.QwickChipMode = false;
			request.TransactionType = 0;
			request.Amount = parseFloat($("#emvAmount").val());
			request.PaymentMethods = ["MSR","Contact","Contactless"];
                        
            log("[Request to " + api + "RequestSmartCardV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "RequestSmartCardV1", 
				request, 
				function (success) 
				{					
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));
					
					//Send ARPC
					request = {};
					request.DeviceID = $("#DeviceID").val();
					request.WaitTime = 10;
					request.ApprovalStatus = parseInt($("#emvApprovalStatus").val());
					request.IssuerAuthenticationData = "00";
					request.IssuerScriptTemplate1 = "00";
					request.IssuerScriptTemplate2 = "00";
			
					log("[Request to " + api + "RequestSendAcquirerResponseV1:]\n" + JSON.stringify(request, null, "\t"));
					post(baseurl + api + "RequestSendAcquirerResponseV1", 
						request, 
						function (success) 
						{					
							log("[Response:]\n" + JSON.stringify(success, null, "\t"));
						}, 
						function (fail) { });
				
					
					
				}, 
				function (fail) { });
			
        };

        function startQuickChipEmv() {
            var request = {};
            request.DeviceID = $("#DeviceID").val();
			request.WaitTime = 30;
			request.PaymentMethods = ["MSR","Contact","Contactless"];
            request.Amount = parseFloat($("#emvAmount").val());
            request.TransactionType = 0;
            request.QwickChipMode = true;

            log("[Request to " + api + "RequestSmartCardV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "RequestSmartCardV1", 
				request, 
				function (success) 
				{					
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));
				}, 
				function (fail) { });
        };

        function requestPINWithSuppliedPANV1() {
            var request = {};
            request.DeviceID = $("#DeviceID").val();
			request.WaitTime = 30;
			request.PINMode = 0;
			request.MaxPINLength = 12;
			request.MinPINLength = 4;
			request.Format = 1;
			request.PAN = $("#suppliedPAN").val();

            log("[Request to " + api + "RequestPINWithSuppliedPANV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "RequestPINWithSuppliedPANV1", 
				request, 
				function (success) 
				{					
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));

				}, 
				function (fail) { });
        };


        function requestPINWithPANFromCardV1() {		
            var request = {};
            request.DeviceID = $("#DeviceID").val();
			request.WaitTime = 30;
			request.PINMode = 1;
			request.MaxPINLength = 12;
			request.MinPINLength = 4;
			request.Format = 0;
			request.UserSupplyPANMethods = ["MSR","Contact","Contactless"];

            log("[Request to " + api + "RequestPINWithPANFromCardV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "RequestPINWithPANFromCardV1", 
				request, 
				function (success) 
				{
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));

				}, 
				function (fail) { });
        };

        function endPINSessionV1() {
            var request = {};
            request.DeviceID = $("#DeviceID").val();
			request.Option = $("#epsOption").val();

            log("[Request to " + api + "endPINSessionV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "endPINSessionV1", 
				request, 
				function (success) 
				{
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));
				},
				function (fail) { });

        };

        function requestSignatureV1() {
            var request = {};
            request.DeviceID = $("#DeviceID").val();
			request.WaitTime = $("#rsWaitTime").val();

            log("[Request to " + api + "requestSignatureV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "requestSignatureV1", 
				request, 
				function (success) 
				{
					var signatureBase64 = success.SignatureOutput.SignatureData;
					var signatureAscii = atob(signatureBase64);
					
					
					const raw = atob(signatureBase64);
					var signatureHex = '';
					for (let i = 0; i < raw.length; i++) 
					{
						const hex = raw.charCodeAt(i).toString(16);
						signatureHex += (hex.length == 2 ? hex : '0' + hex) + ",";
					}
					
					
					//Convert string inside the textbox into byte array
					var data = signatureHex;
					data = data.replace(/ /g, ""); //Remove spaces
					data = data.replace(/,/g, ""); //Remove commas
					var dataArray = [];					
					for (i = 0; i < data.length; i++)
					{
						dataArray[i] = parseInt(data.substr(i*2, 2), 16);		
					}
					DisplaySignature(dataArray);
															
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));
				},
				function (fail) { });
        };
		
		function DisplaySignature(dataArray){
			//Display the Signature
			var canvas = document.getElementById("myCanvas");
			var ctx = canvas.getContext("2d");
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			ctx.beginPath();
	
			for (i = 0; i < dataArray.length; i += 2)
			{
				pixelX  = dataArray[i];
				pixelY  = dataArray[i + 1];
				if (pixelY != 255) //Proceed if pin lift not detected.
				{
					ctx.lineTo(pixelX, pixelY);
				}
				else //Pin lift detected: get next set instead.
				{
					i = i + 2;
					pixelX  = dataArray[i];
					pixelY  = dataArray[i + 1];
					ctx.moveTo(pixelX, pixelY);			
				}		
			}
			ctx.stroke(); 
		}	




        function displayMessageV1() {
            var request = {};
            request.DeviceID = $("#DeviceID").val();
			request.WaitTime = 10;
			request.MessageID = $("#dmMessageID").val();

            log("[Request to " + api + "DisplayMessageV1:]\n" + JSON.stringify(request, null, "\t"));

				},

        };

        function requestSendCommandV1() {

            post(baseurl + api + "RequestSendCommandV1",

				},

        };

        function showBarCodeV1() {
            var request = {};
            request.DeviceID = $("#DeviceID").val();
			request.WaitTime = 10;
			request.Message = $("#ofsbcMessage").val();
			request.Prompt = "";
			request.BlockColor = "000000";
			request.BackgroundColor = "FFFFFF";			
				
            log("[Request to " + api + "ShowBarCodeV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "ShowBarCodeV1", 
				request,

        };

        function scanBarCodeV1() {
            var request = {};
            request.DeviceID = $("#DeviceID").val();

            log("[Request to " + api + "ScanBarCodeV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "ScanBarCodeV1",

				{
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));
				},
				function (fail) { });
        };

        function requestManualCardV1() {
            var request = {};
            request.DeviceID = $("#DeviceID").val();
			request.WaitTime = 10;
			request.Amount = parseFloat($("#ofrmcAmount").val());
				
            log("[Request to " + api + "RequestManualCardV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "RequestManualCardV1", 
				request, 
				function (success) 
				{
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));
				},
				function (fail) { });
        };

        function requestDeviceList() {
            var request = {};
            request.DeviceType = $("#ofrdlDeviceType").val();
				
            log("[Request to " + api + "RequestDeviceListV1:]\n" + JSON.stringify(request, null, "\t"));
            post(baseurl + api + "RequestDeviceListV1", 
				request, 
				function (success) 
				{
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));
				},
				function (fail) { });
        };

        function CheckHealth() {
			
            log("[Request to " + api + "CheckHealth:]\n" + "\t");
            get(baseurl + api + "CheckHealth",
				function (success) 
				{
					log("[Response:]\n" + JSON.stringify(success, null, "\t"));
				},
				function (fail) { });
        };


    </script>
    <div class="container-md text-center">
